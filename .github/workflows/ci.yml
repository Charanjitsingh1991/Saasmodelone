name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (postgres ${{ matrix.postgres }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        postgres: ['16', '17']
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
      DB_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres
      DB_OWNER_URL: postgres://saas_owner:ci-owner-password@localhost:5432/saasmodels
      DB_RUNTIME_URL: postgres://saas_runtime:ci-runtime-password@localhost:5432/saasmodels
      DB_AUTH_URL: postgres://saas_auth:ci-auth-password@localhost:5432/saasmodels
      TEST_DB_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres
      TEST_DB_OWNER_URL: postgres://saas_owner:ci-owner-password@localhost:5432/saasmodels
      TEST_DB_RUNTIME_URL: postgres://saas_runtime:ci-runtime-password@localhost:5432/saasmodels
      TEST_DB_AUTH_URL: postgres://saas_auth:ci-auth-password@localhost:5432/saasmodels
      SAAS_OWNER_PASSWORD: ci-owner-password
      SAAS_RUNTIME_PASSWORD: ci-runtime-password
      SAAS_AUTH_PASSWORD: ci-auth-password
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare pnpm@10.18.3 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Secret scan
        run: pnpm secret-scan

      - name: Production dependency audit
        run: pnpm audit --prod --audit-level high

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Import boundaries
        run: pnpm lint:boundaries

      - name: Bootstrap the database
        run: pnpm db:bootstrap

      - name: Apply migrations
        run: pnpm db:migrate

      - name: Re-apply migrations
        run: pnpm db:migrate

      - name: Seed the module catalog
        run: pnpm db:seed

      - name: Re-seed the module catalog
        run: pnpm db:seed

      - name: Test
        run: pnpm test
